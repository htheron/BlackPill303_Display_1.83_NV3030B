[env:Blackpill_F303cc_183_NV3030B_Debug]
board = robotdyn_blackpill_f303cc
platform = ststm32
framework = arduino
build_type = debug
upload_protocol = stlink
debug_build_flags = 
	-O0
	-ggdb3
	-g3
	-DUSER_SETUP_LOADED=1
	-DSTM32=1
	-DNV3030B_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_BL=PB11
	-DTFT_BACKLIGHT_ON=1
	-DTFT_SPI_PORT=2
	-DTFT_MOSI=PB15
	-DTFT_MISO=PB14
	-DTFT_SCLK=PB13
	-DTFT_CS=PB12
	-DTFT_DC=PA8
	-DTFT_RST=PB10
	-DLOAD_GLCD=1
	-DLOAD_FONT7=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSUPPORT_TRANSACTIONS=1
debug_tool = stlink
lib_deps = 
	bodmer/TFT_eSPI@^2.3.70
	adafruit/Adafruit BMP3XX Library@^2.1.0
	mathertel/RotaryEncoder@^1.5.2
	stm32duino/STM32duino RTC@^1.1.0
